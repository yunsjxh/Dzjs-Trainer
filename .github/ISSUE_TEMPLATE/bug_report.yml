name: "问题反馈"
description: 反馈 Bug / 使用问题 / 建议（请尽量附日志）
title: "[Issue] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！为了更快定位问题，请尽量提供：

        - **日志**：主程序目录下的 `DzjsTrainer.log`
        - **相关信息**：出问题的页面、涉及的进程名、极域版本

        > 日志在程序目录下：`DzjsTrainer.log`。装在 Program Files 里写不进去时，
        > 会改写到 `%LOCALAPPDATA%\DzjsTrainer\DzjsTrainer.log`。
        > 也可以打开程序左侧「日志」页点「导出日志」，会生成 `DzjsTrainer-log-日期-时间.txt`。
        > 文件直接拖到下面的输入框就能上传。

  - type: dropdown
    id: issue_type
    attributes:
      label: 问题类型
      description: 请选择最接近的类型
      options:
        - Bug（功能异常/报错）
        - Question（使用疑问）
        - Enhancement（功能建议）
        - Documentation（文档问题）
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
      placeholder: |
        例如：点「开始运行」后侧栏驱动状态一直是「未加载」，但驱动其实已经起来了，
        期望状态框能显示「已加载」。
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: 涉及页面或进程（可选但建议）
      description: 若问题与某个页面、某个被注入的进程有关，请填写，方便对号入座
      placeholder: 例如：防护策略页 / StudentMain.exe / 极域 2022 豪华版
    validations:
      required: false

  - type: textarea
    id: reproduce_steps
    attributes:
      label: 复现步骤（可选但建议）
      description: 尽量按步骤描述，方便快速复现
      placeholder: |
        1. 打开 DzjsTrainer.exe，进入「防护策略」页
        2. 点「卸载主驱动」，再点一次「加载」
        3. 状态框停在「未加载」
    validations:
      required: false

  - type: input
    id: env_info
    attributes:
      label: 环境信息（可选）
      description: 操作系统、程序版本（「关于」页可见）、是否以管理员运行
      placeholder: 例如：Windows 11 26100 / v1.0.5.2 / 管理员
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志与附件（建议）
      description: |
        请上传程序目录下的 `DzjsTrainer.log`，或「导出日志」生成的 txt。
        也可粘贴关键报错片段，截图、录像一并放这里。
      placeholder: |
        - 已附日志：是/否
        - 关键几行：
          [16:08:12] [I] 运行环境：Windows 11 26100.2314 · x64 · 管理员+UIAccess · 本地会话 · 会话 1
          [16:08:12] [I] 抓屏排除：策略=1 生效=0x11（透过）
        - 其他补充：
    validations:
      required: false
