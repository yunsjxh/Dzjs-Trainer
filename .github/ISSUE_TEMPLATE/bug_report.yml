name: 问题反馈
description: 程序用出问题了，按这个模板说清楚，方便快速定位
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 先说日志

        日志能把一半的问题直接指出来，**麻烦一定带上**：

        - 主程序目录下的 `DzjsTrainer.log`，直接把这个文件拖进下面的输入框就能上传；
        - 如果程序装在 Program Files 里，日志会写不进去，改放到 `%LOCALAPPDATA%\DzjsTrainer\DzjsTrainer.log`，去这个路径找；
        - 或者打开程序左边「日志」页，点「导出日志」，会生成一个 `DzjsTrainer-log-日期-时间.txt`，传这个也行。

        崩溃、卡死、画面异常、更新失败这类问题，没有日志基本上只能靠猜。

  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
      placeholder: |
        发生了什么：
        点「开始运行」以后侧栏的驱动状态一直显示未加载，但驱动其实已经起来了。

        期望的结果：
        状态框应该显示「已加载」。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 可选但建议。尽量按步骤描述，方便快速复现。
      placeholder: |
        1. 打开 DzjsTrainer.exe
        2. 进入「防护策略」页
        3. 点「卸载主驱动」，再点一次「加载」
        4. 状态框停在「未加载」
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 可选。操作系统、程序版本等。程序版本在「关于」页能看到，程序自己也会写进日志第一行。
      placeholder: |
        操作系统：Windows 11 26100 / 极域电子教室 2022 豪华版
        程序版本：1.0.5.2
        位数与权限：32 位主程序，管理员
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志与附件
      description: 建议上传程序日志。也可粘贴关键报错片段。截图、录像一并放这里。
      placeholder: |
        把 DzjsTrainer.log 拖进来，或者粘贴关键几行：
        [16:08:12] [I] 运行环境：Windows 11 26100.2314 · x64 · 管理员+UIAccess · 本地会话 · 会话 1
        [16:08:12] [I] 抓屏排除：策略=1 生效=0x11（透过）
    validations:
      required: false
